<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Break Reminders</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
    }

    h2 {
      margin-top: 0;
    }

    #eyeCountdown,
    #stretchCountdown {
      font-size: 1.6rem;
      margin: 15px 0;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #pauseBtn {
      background-color: #ffcc00;
    }

    #resumeBtn {
      background-color: #4CAF50;
      color: white;
    }

    #pauseBtn.paused {
      background-color: #d4af37;
    }

    #resumeBtn.resumed {
      background-color: #357a38;
    }
  </style>
</head>

<body>
  <h2>👁️ Eye Break Reminder</h2>
  <div id="eyeCountdown">Next eye break in: --:--</div>

  <h2>🧍 Stretch Reminder</h2>
  <div id="stretchCountdown">Next stretch in: --:--</div>

  <button id="pauseBtn" onclick="pauseReminders()">Pause</button>
  <button id="resumeBtn" onclick="resumeReminders()">Resume</button>

  <audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <script>
    // Eye break: every 20 minutes
    const EYE_INTERVAL_MIN = 20;
    // Stretch break: every 60 minutes
    const STRETCH_INTERVAL_MIN = 60;

    const beep = document.getElementById("beep");
    const eyeCountdown = document.getElementById("eyeCountdown");
    const stretchCountdown = document.getElementById("stretchCountdown");

    const pauseBtn = document.getElementById("pauseBtn");
    const resumeBtn = document.getElementById("resumeBtn");

    let paused = false;

    const timers = {
      eye: { interval: null, target: null, remaining: EYE_INTERVAL_MIN * 60 * 1000 },
      stretch: { interval: null, target: null, remaining: STRETCH_INTERVAL_MIN * 60 * 1000 },
    };

    function startTimers() {
      startTimer("eye", EYE_INTERVAL_MIN, eyeCountdown, "👁️ Time for an eye break!", "Look away from the screen for 20 seconds.");
      startTimer("stretch", STRETCH_INTERVAL_MIN, stretchCountdown, "🧍 Time to stretch!", "Get up and move around for a minute!");
    }

    function startTimer(name, minutes, display, title, message) {
      const timer = timers[name];
      timer.target = Date.now() + timer.remaining;
      if (timer.interval) clearInterval(timer.interval);
      timer.interval = setInterval(() => updateCountdown(name, minutes, display, title, message), 1000);
    }

    function updateCountdown(name, minutes, display, title, message) {
      const timer = timers[name];
      const now = Date.now();
      const diff = Math.max(0, timer.target - now);

      const mm = Math.floor(diff / 60000).toString().padStart(2, '0');
      const ss = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
      display.textContent = `Next ${name} break in: ${mm}:${ss}`;

      if (diff <= 0) {
        showNotification(title, message);
        beep.play().catch(e => console.log("Sound failed", e));
        timer.remaining = minutes * 60 * 1000;
        timer.target = Date.now() + timer.remaining;
      }
    }

    function pauseReminders() {
      if (paused) return;
      for (const key in timers) {
        const t = timers[key];
        t.remaining = t.target - Date.now();
        clearInterval(t.interval);
      }
      paused = true;
      pauseBtn.classList.add("paused");
      resumeBtn.classList.remove("resumed");
    }

    function resumeReminders() {
      if (!paused) return;
      for (const key in timers) {
        const t = timers[key];
        t.target = Date.now() + t.remaining;
        t.interval = setInterval(() => {
          const { interval, target, remaining } = t;
        }, 1000);
      }
      startTimers(); // restart countdowns cleanly
      paused = false;
      resumeBtn.classList.add("resumed");
      pauseBtn.classList.remove("paused");
    }

    // Handle tab visibility
    document.addEventListener("visibilitychange", () => {
      if (!paused && document.visibilityState === "visible") {
        for (const key in timers) {
          const t = timers[key];
          t.remaining = t.target - Date.now();
          t.target = Date.now() + t.remaining;
        }
      }
    });

    function showNotification(title, message) {
      if (Notification.permission === "granted") {
        new Notification(title, { body: message });
      }
    }

    if (Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    startTimers();
  </script>
</body>

</html>
